[package]
name = "katara-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
bufbuild_protovalidate_anthropics_buffa = { version = "=0.7.1-20260825204119-511051f7f437.1", registry = "buf", default-features = false }
bufbuild_protovalidate_anthropics_connect-rust = { version = "=0.7.0-20260825204119-511051f7f437.2", registry = "buf", default-features = false }
clap = { version = "4.5.53", features = ["derive", "env"] }
connectrpc = { version = "0.7.0", features = ["client", "client-tls"] }
googleapis_googleapis_anthropics_buffa = { version = "=0.7.1-20261015202054-8ac61b9e5023.1", registry = "buf", default-features = false }
googleapis_googleapis_anthropics_connect-rust = { version = "=0.7.0-20261015202054-8ac61b9e5023.2", registry = "buf", default-features = false }
http = "1.3.1"
katara-ai_katara_anthropics_buffa = { version = "=0.7.1-20261104142854-9b18c8482afc.1", registry = "buf" }
katara-ai_katara_anthropics_connect-rust = { version = "=0.7.0-20261104142854-9b18c8482afc.2", registry = "buf" }
rpassword = "7.5.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
webpki-roots = "1.0.4"

[dev-dependencies]
buffa = "0.8.0"

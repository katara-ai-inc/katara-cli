name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: katara-cli-x86_64-unknown-linux-gnu
            binary_name: katara-cli
            archive_name: katara-cli-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            asset_name: katara-cli-x86_64-apple-darwin
            binary_name: katara-cli
            archive_name: katara-cli-x86_64-apple-darwin.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            asset_name: katara-cli-aarch64-apple-darwin
            binary_name: katara-cli
            archive_name: katara-cli-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: katara-cli-x86_64-pc-windows-msvc
            binary_name: katara-cli.exe
            archive_name: katara-cli-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo files
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Configure Buf Cargo registry credentials
        shell: bash
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${BUF_TOKEN}" ]]; then
            echo "::error::BUF_TOKEN secret is required to access the Buf Cargo registry"
            exit 1
          fi

          mkdir -p ~/.cargo
          cat > ~/.cargo/credentials.toml <<EOF
          [registries.buf]
          token = "${BUF_TOKEN}"
          EOF
          chmod 600 ~/.cargo/credentials.toml

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/${{ matrix.binary_name }}"

          if [[ "${{ matrix.archive_name }}" == *.zip ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/${{ matrix.binary_name }}' -DestinationPath '${{ matrix.archive_name }}' -Force"
          else
            tar -czf "${{ matrix.archive_name }}" -C dist "${{ matrix.binary_name }}"
          fi

      - name: Generate checksum
        shell: bash
        run: |
          set -euo pipefail

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.archive_name }}" > "${{ matrix.archive_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive_name }}" > "${{ matrix.archive_name }}.sha256"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*
          generate_release_notes: true

name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".cargo/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - "src/**"
      - "tests/**"
      - "scripts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_name: katara-cli
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: katara-cli
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary_name: katara-cli
          - os: macos-15
            target: aarch64-apple-darwin
            binary_name: katara-cli
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary_name: katara-cli.exe

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Python for packaging
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test release packaging
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo files
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Check Linux runtime baseline
        if: runner.os == 'Linux'
        run: >-
          python scripts/release.py check-linux
          --binary "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"

      - name: Smoke-test native binary
        shell: bash
        run: '"target/${{ matrix.target }}/release/${{ matrix.binary_name }}" document upload --help'

      - name: Package archive
        run: >-
          python scripts/release.py package
          --binary "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          --target "${{ matrix.target }}" --output-dir dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: katara-cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout release verifier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Python for verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: katara-cli-*
          merge-multiple: true

      - name: Verify all platform archives and checksums
        run: python scripts/release.py verify --directory dist

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
